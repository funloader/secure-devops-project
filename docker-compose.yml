version: '3.8'
services:
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      - product-api
      - order-api
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Windows/Mac fix
  product-api:
    build: ./product-api
    ports:
      - "5001:5001"
  order-api:
    build: ./order-api
    ports:
      - "5002:5002"
